name: CI/CD Pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Importante: Descarga todo el historial git para buscar en el pasado

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # JOB 1: BACKEND AUTH + MYSQL + SONARCLOUD
  build-auth-server:
    name: Build & Analyze Auth Server
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agprueba
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for mvnw
        run: chmod +x authorization-server/mvnw

        # NUEVO: Generar el SBOM (Lista de ingredientes del software)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./authorization-server
          format: spdx-json
          output-file: authorization-server-sbom.spdx.json

      # NUEVO: Guardar el SBOM como artefacto para tener "Control"
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-auth-server
          path: authorization-server-sbom.spdx.json

      - name: Build and Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd authorization-server
          ./mvnw clean verify sonar:sonar \
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/agprueba \
          -Dspring.datasource.username=root \
          -Dspring.datasource.password=root \
          -Dsonar.projectKey=POC-GPI2_auth \
          -Dsonar.organization=cosmosheaven \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.qualitygate.wait=true
      
      - name: Archive Auth Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-server-release-${{ github.sha }}
          path: authorization-server/target/*.jar
          retention-days: 30

  # JOB 2: BACKEND RESOURCE + MYSQL + SONARCLOUD
  build-resource-server:
    name: Build & Analyze Resource Server
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agprueba
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for mvnw
        run: chmod +x resource-server/mvnw

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./resource-server
          format: spdx-json
          output-file: resource-server-sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-resource-server
          path: resource-server-sbom.spdx.json

      - name: Build and Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd resource-server
          ./mvnw clean verify sonar:sonar \
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/agprueba \
          -Dspring.datasource.username=root \
          -Dspring.datasource.password=root \
          -Dspring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com \
          -Dspring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs \
          -Dsonar.projectKey=POC-GPI2_resource \
          -Dsonar.organization=cosmosheaven \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.qualitygate.wait=true
        
      - name: Archive Resource Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resource-server-release-${{ github.sha }}
          path: resource-server/target/*.jar
          retention-days: 30

  # JOB 3: FRONTEND
  build-frontend:
    name: Build & Analyze Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package-lock.json
      
      - name: Install Dependencies
        run: cd ag-prueba-front && npm ci

      - name: Run ESLint
        run: cd ag-prueba-front && npm run lint

      # Tests con cobertura para Sonar
      - name: Run Tests with Coverage
        run: cd ag-prueba-front && npm run test -- --no-watch --code-coverage --browsers=ChromeHeadless

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ag-prueba-front
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Angular Production
        run: cd ag-prueba-front && npm run build -- --configuration=production
      
      - name: Archive Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: ag-prueba-front/dist/
          retention-days: 30

  # JOB 4: DEPLOY
  deploy:
    needs: [build-auth-server, build-resource-server, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: Production
    steps:
      - name: Simulate Deployment
        run: echo "🚀 Deploying version ${{ github.sha }} to production..."