name: CI/CD Pipeline

on:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    # ------------------------------------------------------------------
    # JOB 1: BACKEND AUTH (Build + Tests)
    # ------------------------------------------------------------------
    build-auth-server:
        name: Build & Test Auth Server
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"
                  cache: "maven"

            - name: Grant execute permission for mvnw
              run: chmod +x authorization-server/mvnw

            - name: Run Tests and Build
              # Eliminamos -DskipTests. Maven correrá 'test' antes de 'package'
              run: cd authorization-server && ./mvnw clean package

    # ------------------------------------------------------------------
    # JOB 2: BACKEND RESOURCE (Build + Tests)
    # ------------------------------------------------------------------
    build-resource-server:
        name: Build & Test Resource Server
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"
                  cache: "maven"

            - name: Grant execute permission for mvnw
              run: chmod +x resource-server/mvnw

            - name: Run Tests and Build
              # Eliminamos -DskipTests. Maven correrá 'test' antes de 'package'
              run: cd resource-server && ./mvnw clean package

    # ------------------------------------------------------------------
    # JOB 3: FRONTEND ANGULAR (Build + Tests)
    # ------------------------------------------------------------------
    build-frontend:
        name: Build & Test Frontend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: ag-prueba-front/package-lock.json

            - name: Install Dependencies
              run: cd ag-prueba-front && npm ci

            - name: Run Unit Tests
              # --watch=false: Para que no se quede congelado esperando cambios
              # --browsers=ChromeHeadless: Para ejecutar sin interfaz gráfica en el servidor
              run: cd ag-prueba-front && npm run test -- --watch=false --browsers=ChromeHeadless

            - name: Build Angular Production
              run: cd ag-prueba-front && npm run build -- --configuration=production

    # ------------------------------------------------------------------
    # JOB 4: DEPLOY (Solo si todos los tests pasan)
    # ------------------------------------------------------------------
    deploy:
        # Si algún test falla en los jobs anteriores, este paso se cancela automáticamente
        needs: [build-auth-server, build-resource-server, build-frontend]
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        environment: Production

        steps:
            - name: Simulate Deployment
              run: |
                  echo "✅ All tests passed and artifacts built."
                  echo "🚀 Deploying version ${{ github.sha }} to production..."
