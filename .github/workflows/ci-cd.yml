name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # JOB 1: BACKEND AUTH
  build-auth-server:
    name: Build & Analyze Auth Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for mvnw
        run: chmod +x authorization-server/mvnw

      - name: Build and Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  
        run: |
          cd authorization-server
          # Se elimina -DskipTests para que se ejecute la cobertura
          ./mvnw clean verify sonar:sonar \
          -Dsonar.projectKey=CoSmOsHeaven_POC-GPI2 \
          -Dsonar.organization=cosmosheaven \
          -Dsonar.host.url=https://sonarcloud.io

  # JOB 2: BACKEND RESOURCE + SONARCLOUD
  build-resource-server:
    name: Build & Analyze Resource Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for mvnw
        run: chmod +x resource-server/mvnw

      - name: Build and Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd resource-server
          ./mvnw clean verify sonar:sonar \
          -Dsonar.projectKey=CoSmOsHeaven_POC-GPI2 \
          -Dsonar.organization=cosmosheaven \
          -Dsonar.host.url=https://sonarcloud.io

  # JOB 3: FRONTEND + SONARCLOUD
  build-frontend:
    name: Build & Analyze Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package-lock.json
      
      - name: Install Dependencies
        run: cd ag-prueba-front && npm ci

      - name: Run ESLint
        run: cd ag-prueba-front && npm run lint

      - name: Run Tests with Coverage
        run: cd ag-prueba-front && npm run test -- --no-watch --code-coverage --browsers=ChromeHeadless

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ag-prueba-front
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Angular Production
        run: cd ag-prueba-front && npm run build -- --configuration=production

  # JOB 4: DEPLOY SIMULATION
  deploy:
    needs: [build-auth-server, build-resource-server, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: Production
    steps:
      - name: Simulate Deployment
        run: echo "🚀 Deploying version ${{ github.sha }} to production..."